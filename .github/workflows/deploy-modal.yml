# Puts Georgia Now's hourly run on Modal's schedule (modal_hourly.py). Runs by itself when run.py, the model or
# modal_hourly.py change, or by hand (Actions -> Deploy to Modal -> Run workflow).
# Needs repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (Modal -> Settings -> API Tokens), plus the
# STORMWATCH_API / STORMWATCH_KEY already here, which are copied into a Modal secret and never printed.
# Then a test run prints a sample forecast (and which model made it) without sending anything.
name: Deploy to Modal
on:
  push:
    branches: [main]
    paths: ['run.py', 'ptype_core.py', 'model/**', 'modal_hourly.py']
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q modal
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          STORMWATCH_API: ${{ secrets.STORMWATCH_API }}
          STORMWATCH_KEY: ${{ secrets.STORMWATCH_KEY }}
        run: |
          modal secret create stormwatch-server STORMWATCH_API="$STORMWATCH_API" STORMWATCH_KEY="$STORMWATCH_KEY" --force > /dev/null
          modal deploy modal_hourly.py
      - name: Test run (prints a sample forecast, sends nothing)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run modal_hourly.py
