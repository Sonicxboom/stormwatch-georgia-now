# Georgia Now, backup run: Modal runs the hourly forecast at :55 (modal_hourly.py); this runs at :25 and only sends when
# Modal hasn't in the last hour.
# Needs two repository secrets: STORMWATCH_API (your server's address) and STORMWATCH_KEY (its key).
name: Georgia Now hourly (backup)
on:
  schedule:
    - cron: '25 * * * *'   # backup half an hour after Modal's :55 run
  workflow_dispatch: {}
concurrency: { group: georgia-now, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt }
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Forecast and send
        env:
          STORMWATCH_API: ${{ secrets.STORMWATCH_API }}
          STORMWATCH_KEY: ${{ secrets.STORMWATCH_KEY }}
        run: python run.py --backup
      - name: Keep the hourly schedule alive (GitHub pauses schedules after 60 quiet days)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            date -u > keepalive.txt
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add keepalive.txt && git commit -m 'Monthly keep-alive' && git push
          fi
